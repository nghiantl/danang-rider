name: CI - Web Build & API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build web and test API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run API tests
        run: npm test

      - name: Test building collision
        run: node --experimental-strip-types --test apps/web/src/collision.test.mjs

      - name: Test OSM map and navigation geometry
        run: node --experimental-strip-types --test apps/web/src/osm.test.mjs

      - name: Test world chunks
        run: node --experimental-strip-types --test apps/web/src/world.test.mjs

      - name: Test GPS routing
        run: node --experimental-strip-types --test apps/web/src/navigation.test.mjs

      - name: Test AI traffic
        run: node --experimental-strip-types --test apps/web/src/traffic.test.mjs
      - name: Pedestrian tests
        run: node --experimental-strip-types --test apps/web/src/pedestrians.test.mjs

      - name: Test environment
        run: node --experimental-strip-types --test apps/web/src/environment.test.mjs

      - name: Test audio levels
        run: node --experimental-strip-types --test apps/web/src/gameAudio.test.mjs

      - name: Test orders and income
        run: node --experimental-strip-types --test apps/web/src/orders.test.mjs

      - name: Typecheck and build Web 3D
        run: npm run build

      - name: Upload web build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: danang-rider-web-dist
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 7
