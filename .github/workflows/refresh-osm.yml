name: Refresh Da Nang OSM snapshot
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test official OSM XML converter
        run: node --test scripts/update-osm.test.mjs
      - name: Download real OSM roads and buildings
        run: node scripts/update-osm.mjs
      - name: Commit refreshed map data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/data/danang-osm.json
          if git diff --cached --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "data: refresh Da Nang OSM snapshot"
            git push
          fi
